<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pressure Controller Web Manager</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body class="webmanager-page">
  <div class="topnav">
    <h1>Pressure Controller</h1>
    <h2>Web Manager</h2>
  </div>
  <main class="content webmanager-content">
    <section class="card webmanager-card">
      <form action="/webmanager" method="POST" class="webmanager-form">
        <h3>Wi-Fi</h3>
        <div class="webmanager-field">
          <label for="ssid">Network</label>
          <input type="text" id="ssid" name="ssid" autocomplete="username" required>
        </div>
        <div class="webmanager-field">
          <label for="pass">Password</label>
          <input type="password" id="pass" name="pass" autocomplete="current-password" required>
        </div>

        <h3>MQTT</h3>
        <div class="webmanager-field">
          <label for="mqtt_host">Host</label>
          <input type="text" id="mqtt_host" name="mqtt_host">
        </div>
        <div class="webmanager-field">
          <label for="mqtt_port">Port</label>
          <input type="number" id="mqtt_port" name="mqtt_port">
        </div>
        <div class="webmanager-field">
          <label for="mqtt_user">User</label>
          <input type="text" id="mqtt_user" name="mqtt_user" autocomplete="username">
        </div>
        <div class="webmanager-field">
          <label for="mqtt_password">Password</label>
          <input type="password" id="mqtt_password" name="mqtt_password" autocomplete="current-password">
        </div>
        <div class="webmanager-field">
          <label for="mqtt_topic">Topic</label>
          <input type="text" id="mqtt_topic" name="mqtt_topic">
        </div>

        <div class="webmanager-actions">
          <a href="/" class="button">Home</a>
          <input type="submit" value="Save and Restart">
        </div>
      </form>
    </section>
  </main>
</body>
</html>
