[platformio]
boards_dir = BoardDefinition

[env:esp32-s3-devkitc-1-myboard]
platform = espressif32
platform_packages =  framework-arduinoespressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain
lib_ignore = FTP

board_build.filesystem = littlefs
board_build.partitions = my_partitions.csv

; build_type = debug
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=1
	; SimpleFTPServer defaults to FFat on ESP32. Force Wi-Fi + LittleFS globally.
	-D DEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=6
	-D DEFAULT_STORAGE_TYPE_ESP32=7

lib_deps =
	lvgl/lvgl@8.4.0
	tamctec/TAMC_GT911@1.0.2
	lovyan03/LovyanGFX@1.2.19
	;adafruit/Adafruit GFX Library@1.12.5
	adafruit/Adafruit ADS1X15@2.6.2
	adafruit/Adafruit BusIO@1.17.4
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.10.0
	bblanchon/ArduinoJson@7.4.3
	xreef/SimpleFTPServer@3.0.1
	chrissb/PCAL9535A Library@1.2.4
	elims/PsychicMqttClient@0.2.4
