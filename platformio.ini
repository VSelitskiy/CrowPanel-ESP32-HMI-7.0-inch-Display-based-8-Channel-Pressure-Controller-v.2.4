; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-myboard]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
; extra_scripts = pre:rename_firmware.py, post:rename_firmware.py
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags = 
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I./include
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=1
monitor_filters = esp32_exception_decoder
; build_type = debug
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; board_build.partitions = huge_app.csv

lib_deps = 
	lvgl/lvgl@^8.4.0
	tamctec/TAMC_GT911@^1.0.2
	lovyan03/LovyanGFX@^1.1.16
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ADS1X15@^2.5.0
	adafruit/Adafruit BusIO@^1.16.1
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson@^7.1.0
	lib/FTPClientServer-master
	chrissb/PCAL9535A Library@^1.2.3
	elims/PsychicMqttClient@^0.2.0